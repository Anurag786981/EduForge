<!-- Breadcrumb trail: last item is the current page (non-clickable) -->
<nav class="breadcrumb" aria-label="Breadcrumb">
  @for (crumb of breadcrumbService.crumbs(); track crumb.url; let last = $last) {
    @if (!last) {
      <a class="breadcrumb__link" [routerLink]="crumb.url">{{ crumb.label }}</a>
      <mat-icon class="breadcrumb__sep">chevron_right</mat-icon>
    } @else {
      <span class="breadcrumb__current">{{ crumb.label }}</span>
    }
  }
</nav>
